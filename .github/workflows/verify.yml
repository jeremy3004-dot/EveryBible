name: Verify Workspace

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Workspace verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace and release contracts
        run: npm run release:verify
