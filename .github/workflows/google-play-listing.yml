name: Google Play Listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-listing:
    name: Publish Google Play listing assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Google Play service account key
        # S18: pass the secret through the step environment instead of interpolating it into
        # the script text. `${{ }}` is substituted before bash parses the line, so a quote
        # inside the JSON would break out of the single-quoted string and the remainder of the
        # key would be executed as shell. A quoted "$VAR" expansion is never re-parsed.
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./google-play-service-account.json

      - name: Publish listing text and images
        run: npm run play:publish-listing
